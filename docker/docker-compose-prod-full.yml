# T-800 production stack with bundled Caddy reverse proxy using a
# user-supplied TLS certificate (no Let's Encrypt / ACME).
#
# For self-hosters who already have a signed certificate (internal CA,
# wildcard cert, commercial CA, etc.) and want Caddy to serve T-800 on
# their public domain over HTTPS without issuing its own cert.
#
# Requirements:
#   - A domain (DNS record) pointing at this host
#   - A certificate chain + private key on disk:
#       ./certs/fullchain.pem   (cert + any intermediates)
#       ./certs/privkey.pem     (private key, unencrypted)
#
# Usage:
#   export DOMAIN=t800.example.com
#   mkdir -p ./certs
#   # copy your fullchain.pem and privkey.pem into ./certs/
#   docker compose -f docker-compose-prod-full.yml up -d
#
# If you already run a reverse proxy in front of this host, use
# docker-compose.prod.yml instead — it omits the bundled proxy and
# exposes the app on a plain HTTP port.

services:
  caddy:
    image: caddy:2-alpine
    container_name: t800-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: "${DOMAIN:?set DOMAIN to your public hostname}"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - ./certs:/etc/caddy/certs:ro
      - caddy-config:/config
    depends_on:
      - t800
    networks:
      - t800-net

  t800:
    image: legitservices/t-800:latest
    container_name: t800
    restart: unless-stopped
    volumes:
      - t800-data:/app/data
    environment:
      PORT: "8080"
      ENABLE_SSL: "false"
      DATA_DIR: "/app/data"
      NODE_ENV: "production"
    depends_on:
      - guacd
    networks:
      - t800-net

  guacd:
    image: guacamole/guacd:latest
    container_name: t800-guacd
    restart: unless-stopped
    networks:
      - t800-net

configs:
  caddyfile:
    content: |
      {
        auto_https disable_redirects
      }
      {env.DOMAIN} {
        tls /etc/caddy/certs/fullchain.pem /etc/caddy/certs/privkey.pem
        encode zstd gzip
        # Long-lived WebSockets (terminal, server-stats, guacamole):
        # disable response buffering and proxy timeouts so sessions can
        # idle for hours/days without being torn down by the proxy.
        reverse_proxy t800:8080 {
          flush_interval -1
          transport http {
            read_timeout 0
            write_timeout 0
            dial_timeout 30s
            keepalive 30s
            keepalive_idle_conns_per_host 16
          }
        }
      }

volumes:
  t800-data:
    driver: local
  caddy-config:
    driver: local

networks:
  t800-net:
    driver: bridge
