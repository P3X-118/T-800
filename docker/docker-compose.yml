services:
  t800:
    image: legitservices/t-800:latest
    container_name: t800
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - t800-data:/app/data
    environment:
      PORT: "8080"
    depends_on:
      - guacd
    networks:
      - t800-net

  guacd:
    image: guacamole/guacd:latest
    container_name: guacd
    restart: unless-stopped
    ports:
      - "4822:4822"
    networks:
      - t800-net

volumes:
  t800-data:
    driver: local

networks:
  t800-net:
    driver: bridge
